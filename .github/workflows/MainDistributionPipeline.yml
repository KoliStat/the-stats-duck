name: Main Extension Distribution Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Manual runs on a branch: the full matrix before a release-branch PR
  # merges, since pull requests into v0.* do not trigger this pipeline.
  # Nothing deploys from such a run; both deploy flags below are false
  # unless the ref is main or a tag.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  # Pins follow the DuckDB stable that the community registry builds against.
  # The duckdb/ submodule stays on v1.4.3 for the browser builds in docs/,
  # because @duckdb/duckdb-wasm (1.32.0 and 1.33.0) still bundles v1.4.3.
  # windows_amd64 (MSVC) is back in the matrix: the v1.5.6 reusable workflow
  # checks both the VS 18 and the VS 2022 vcvars paths, which fixes the
  # mingw fallback that v1.4.3 hit on the current windows-latest image
  # (duckdb/extension-ci-tools#371).
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      extension_name: stats_duck
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6

  # The LTS line the community registry still builds (build_andium.yml pins
  # DuckDB v1.4.5 with ci-tools v1.4-andium). v0.9 was verified against it by
  # hand - clean build, 2639 SQL assertions - and this job keeps that true
  # instead of leaving it a one-off measurement. Build only, no deploy: the
  # registry produces the LTS binaries it serves, so ours would be redundant.
  # artifact_postfix keeps these artifacts from colliding with the stable job's.
  duckdb-lts-build:
    name: Build against the LTS line (compatibility guard)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4-andium
    with:
      extension_name: stats_duck
      duckdb_version: v1.4.5
      ci_tools_version: v1.4-andium
      artifact_postfix: -lts
      # The v1.4-andium default vcpkg (ce613c41) builds zlib with a MSYS2 runtime
      # package the MSYS2 mirrors no longer serve (HTTP 404), so windows_amd64
      # failed before our sources compiled. The v2.0-cyanoptera default (vcpkg
      # release 2026.06.24) built every Windows target in the same run.
      vcpkg_commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

  # The line the community registry builds by default since 2026-10-20
  # (build.yml pins DuckDB v2.0.0 with ci-tools v2.0-cyanoptera). The port
  # (#46) was verified by hand on Windows with MSVC; this job builds it with
  # GCC, Clang and emscripten as well. Build only, as above. The two opt-in
  # platforms are the ones the registry descriptor will request: osx_amd64
  # became opt-in under v2.0-cyanoptera, and windows_arm64 always was.
  duckdb-v2-build:
    name: Build against DuckDB 2.0 (compatibility guard)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      extension_name: stats_duck
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      artifact_postfix: -v2
      opt_in_archs: "windows_arm64;osx_amd64"

  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs: duckdb-stable-build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@v1.5.6
    secrets: inherit
    # The reusable deploy workflow declares no permissions and relies on the
    # default GITHUB_TOKEN. actions/download-artifact@v4 (v4.3.0+) needs
    # `actions: read` to ListArtifacts; on the push-to-main event the default
    # token lacks it, so the artifact download 403s. Grant it explicitly (the
    # caller's permissions propagate to the reusable workflow). contents: read
    # is for the checkout step; the S3 upload uses inherited secrets, not the
    # token. See duckdb/extension-ci-tools _extension_deploy.yml.
    permissions:
      contents: read
      actions: read
    with:
      extension_name: stats_duck
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
